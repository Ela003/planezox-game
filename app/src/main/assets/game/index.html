<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Warmier: The Rise of the Cyclops</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09120e;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://appassets.androidplatform.net/webjars/three/build/three.module.min.js",
        "three/addons/": "https://appassets.androidplatform.net/webjars/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <script>
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function () {});
    }
    window.addEventListener('error', function (event) {
      if (window.AndroidBridge && window.AndroidBridge.onWebError) {
        window.AndroidBridge.onWebError(event.message || 'Unknown WebGL script error');
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      if (window.AndroidBridge && window.AndroidBridge.onWebError) {
        var msg = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        window.AndroidBridge.onWebError(msg);
      }
    });
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
